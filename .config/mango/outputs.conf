monitor_rule=name:^DP-2,width:1920,height:1080,refresh:100,x:0,y:0

# x is 1930 because it puts a little resistance on the cursor like in kde plasma
# y is 285 because my monitors aren't lined up verticallly and 285 is almost
# # the exact value of pixels they are off by
monitor_rule=name:^HDMI-A-1,width:1920,height:1080,refresh:100,x:1930,y:285
